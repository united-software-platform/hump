# Сервисы продукта Hump. Файл намеренно отделён от docker-compose.yml окружения агента:
# тот поставлен SDD kit'ом и записан в .sdd-kit-manifest.json с контрольной суммой, поэтому
# правка в нём расходится с манифестом при обновлении kit'а.
services:
  # Локальные модели. Порт наружу не публикуется: обращается к Ollama только шлюз по внутренней
  # сети compose, и открытый порт на хосте лишь расширил бы поверхность доступа.
  #
  # Работа идёт на процессоре. Для видеокарты NVIDIA сервису добавляют резервирование устройств
  # (deploy.resources.reservations.devices) и требуется NVIDIA Container Toolkit на хосте.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama}:${OLLAMA_IMAGE_TAG:-latest}
    # Веса моделей переживают пересоздание контейнера: иначе каждый up качал бы их заново.
    # Каталог проекта, а не именованный том: данные лежат рядом с кодом и видны без docker —
    # их можно посмотреть, скопировать и забрать в резервную копию обычными средствами.
    # Каталог data/ исключён из репозитория: там гигабайты весов и файлы базы.
    volumes:
      - ./data/ollama-models:/root/.ollama
    restart: unless-stopped

  # Разовая загрузка модели: контейнер просит сервер Ollama скачать веса и завершается.
  # Запускается при каждом up и при уже загруженной модели отрабатывает вхолостую.
  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama}:${OLLAMA_IMAGE_TAG:-latest}
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Имя модели совпадает с маршрутом hump-local в config/litellm.yaml — менять надо в обоих местах
    command: ["pull", "qwen3.5:0.8b"]
    restart: "no"

  # Хранилище состояния шлюза: выданные ключи доступа и записи об обращениях. Без него LiteLLM
  # работает, но панель недоступна — авторизация завершается «Not connected to DB!», а все
  # потребители ходят под одним мастер-ключом и неразличимы.
  #
  # Порт наружу не публикуется: к базе обращается только шлюз по внутренней сети compose.
  #
  # Учётные данные берутся подстановкой из .env, а не через env_file: сервису нужны ровно три
  # переменные, и env_file отдал бы ему заодно ключи провайдеров, которые базе ни к чему.
  # Умолчания есть у имени пользователя и имени базы, но не у пароля — см. ниже.
  # Подстановку здесь перекрыть одноимённой переменной хоста можно, но в отличие от адреса
  # маршрута это заметно сразу: расхождение с DATABASE_URL даёт отказ авторизации при старте
  # шлюза, а не молчаливый уход запросов не туда. Форма ${VAR:?...} останавливает compose
  # с внятным сообщением, если переменная не заполнена.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_IMAGE_TAG:-17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      # Пароль умолчания не имеет намеренно: с пустым значением база поднялась бы доступной
      # без пароля. Форма ${VAR:?...} останавливает compose с внятным сообщением
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?переменная не задана — заполните POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      # Данные кладутся в подкаталог точки монтирования, а не в неё саму: initdb требует
      # пустой каталог, а у смонтированного каталога хоста могут быть свои записи и права,
      # которые ему помешают
      PGDATA: /var/lib/postgresql/data/pgdata
    # Данные переживают пересоздание контейнера: там лежат ключи систем-потребителей,
    # и потеря каталога означает отзыв доступа у всех сразу.
    #
    # Каталог принадлежит пользователю postgres из образа, а не владельцу репозитория:
    # содержимое заполняет и читает сама база, правки извне ей вредят.
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Готовность проверяется самим сервисом: шлюз стартует только после того, как база начала
    # принимать соединения, иначе миграции схемы при старте упираются в закрытый порт
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  litellm:
    # Шлюз LLM-запросов: OpenAI-совместимый API поверх облачных провайдеров и локальных моделей.
    # Образ и тег вынесены в переменные: закрепить версию можно в .env, не редактируя этот файл.
    #
    # С подключённой базой тег образа стоит закрепить в .env: схему базы мигрирует сам образ при
    # старте, и смена latest на новую версию меняет схему уже заполненного тома.
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm}:${LITELLM_IMAGE_TAG:-latest}
    # База — условие запуска, а не порядок: шлюз мигрирует схему при старте, и обращение к ещё
    # не принимающей соединения базе даёт отказ при первом же входе в панель. Ollama остаётся
    # обычной зависимостью порядка: её недоступность отражается на одном маршруте, а не на старте.
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    # Ключи и адреса маршрутов приезжают в контейнер значениями из .env; сам файл в репозиторий
    # не попадает. Подстановки ${...} выше читаются compose'ом из того же .env, но другим
    # механизмом — это не дубль.
    #
    # Адрес Ollama блоком environment не дублируется: подстановка ${OLLAMA_API_BASE:-...} берёт
    # значение сначала из окружения процесса, запустившего compose, и одноимённая переменная
    # хоста молча перекрыла бы .env — маршрут ушёл бы не туда, а файлы репозитория выглядели бы
    # настроенными верно. env_file такой подстановке не подвержен, поэтому адрес маршрута задан
    # ровно в одном месте — в .env, и переменная там обязательна: без значения LiteLLM молча
    # берёт localhost:11434, то есть сам контейнер шлюза.
    env_file: .env

    # Остаётся ради варианта с Ollama на хосте: на Linux host.docker.internal сам не резолвится
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    restart: unless-stopped
