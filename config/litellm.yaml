# Маршруты шлюза Hump. Значения ключей в файле не хранятся: только имена переменных окружения
# в форме os.environ/<ИМЯ>, сами значения живут в .env, который исключён из репозитория.
#
# model_name — публичное имя маршрута, его называют системы-потребители; model — конкретная
# модель за ним. Смена модели или провайдера правится здесь и версионируется вместе с проектом.
model_list:
  # Локальный маршрут: модель выполняется на собственной инфраструктуре, запрос не уходит
  # во внешние API. Префикс ollama_chat направляет запрос на /api/chat — путь, рекомендованный
  # документацией Ollama для чат-моделей.
  #
  # Имя модели совпадает с тем, что загружает сервис ollama-pull в docker-compose.hump.yml —
  # менять надо в обоих местах, иначе маршрут будет ссылаться на незагруженные веса.
  - model_name: hump-local
    litellm_params:
      model: ollama_chat/qwen3.5:0.8b
      api_base: os.environ/OLLAMA_API_BASE

  # Облачный маршрут. Провайдер anthropic здесь — это протокол, а не вендор: за ним стоит
  # любой сервис с Anthropic-совместимым API, адрес которого задаёт ANTHROPIC_BASE_URL
  # (сейчас — DeepSeek). Смена вендора не требует правки кода: меняются имя модели в этой
  # записи и две переменные окружения.
  - model_name: hump-cloud
    litellm_params:
      model: "anthropic/deepseek-v4-pro[1m]"
      api_base: os.environ/ANTHROPIC_BASE_URL
      api_key: os.environ/ANTHROPIC_AUTH_TOKEN
